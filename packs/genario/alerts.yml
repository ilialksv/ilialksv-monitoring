groups:
  - name: genario-backend
    interval: 30s
    rules:
      - alert: GenarioHigh5xxRate
        expr: sum by (project, env) (rate(genario_http_requests_total{job="backend",project="genario",status_class="5xx"}[5m])) > 0.1
        for: 10m
        annotations:
          summary: Genario backend 5xx rate is high
          description: Genario {{ $labels.env }} is returning more than 0.1 5xx responses per second for 10 minutes.

      - alert: GenarioHighLatencyP95
        expr: histogram_quantile(0.95, sum by (project, env, le) (rate(genario_http_request_duration_seconds_bucket{job="backend",project="genario"}[5m]))) > 1
        for: 10m
        annotations:
          summary: Genario backend p95 latency is high
          description: Genario {{ $labels.env }} p95 latency has been above 1 second for 10 minutes.
