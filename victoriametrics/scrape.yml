global:
  scrape_interval: 30s
  external_labels:
    stack: ilialksv-monitoring

scrape_configs:
  # Только хост самой monitoring VPS. Метрики приложений приходят
  # remote write-ом от vmagent на других серверах.
  - job_name: node
    scrape_interval: 30s
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          server: "%{SERVER_NAME}"
