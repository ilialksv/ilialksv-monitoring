global:
  scrape_interval: 30s
  external_labels:
    stack: ilialksv-monitoring

scrape_configs:
  # Monitoring VPS host only. Application metrics arrive by remote write
  # from vmagent on the other servers.
  - job_name: node
    scrape_interval: 30s
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          server: "%{SERVER_NAME}"
