# Dokploy injects these variables from the application Environment.
# Set the Dokploy Compose command to --force-recreate, or Grafana will not
# reread dashboard JSON from the bind mount.
# Only grafana (3000), glitchtip (8000), vmauth (8427), dbgate (3000), and
# umami (3000) are public.
# Every other service stays on the monitoring network.

x-glitchtip-environment: &glitchtip-environment
  DATABASE_URL: postgres://${GLITCHTIP_POSTGRES_USER}:${GLITCHTIP_POSTGRES_PASSWORD}@glitchtip-postgres:5432/${GLITCHTIP_POSTGRES_DB}
  VALKEY_URL: redis://:${GLITCHTIP_VALKEY_PASSWORD}@glitchtip-valkey:6379/0
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
  EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
  DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL}
  ENABLE_ADMIN: "${GLITCHTIP_ENABLE_ADMIN}"
  ENABLE_OPENAPI: "${GLITCHTIP_ENABLE_OPENAPI}"
  # The instance is ours alone: nobody signs up and no new organization is
  # made. Set here, not in env: an unset variable left both open in 2026-10.
  ENABLE_USER_REGISTRATION: "false"
  ENABLE_ORGANIZATION_CREATION: "false"
  GLITCHTIP_ENABLE_MCP: "${GLITCHTIP_ENABLE_MCP}"
  GLITCHTIP_ENABLE_DUCKDB: "${GLITCHTIP_ENABLE_DUCKDB}"

services:
  grafana:
    # grafana/grafana is the OSS image; grafana-oss stopped getting releases.
    image: grafana/grafana:12.4.13
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    expose:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - monitoring
      - dokploy-network

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.143.0
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME is required}
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=${VICTORIAMETRICS_RETENTION_MONTHS}
      - -promscrape.config=/etc/victoriametrics/scrape.yml
      - -selfScrapeInterval=30s
    volumes:
      - victoriametrics_data:/victoria-metrics-data
      - ./victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    networks:
      - monitoring

  vmauth:
    image: victoriametrics/vmauth:v1.143.0
    restart: unless-stopped
    environment:
      VMAUTH_USERNAME: ${VMAUTH_USERNAME:?VMAUTH_USERNAME is required}
      VMAUTH_PASSWORD: ${VMAUTH_PASSWORD:?VMAUTH_PASSWORD is required}
    command:
      - -auth.config=/etc/vmauth/config.yml
      - -httpListenAddr=:8427
    expose:
      - "8427"
    volumes:
      - ./vmauth/config.yml:/etc/vmauth/config.yml:ro
    networks:
      - monitoring
      - dokploy-network

  vmalert:
    image: victoriametrics/vmalert:v1.143.0
    restart: unless-stopped
    command:
      - -rule=/etc/vmalert/rules/*.yml
      - -rule=/etc/vmalert/packs/genario/alerts.yml
      - -rule=/etc/vmalert/packs/genicly/alerts.yml
      - -datasource.url=http://victoriametrics:8428
      - -notifier.url=http://alertmanager:9093
      - -httpListenAddr=:8880
      - -datasource.queryStep=30s
    volumes:
      - ./vmalert/rules:/etc/vmalert/rules:ro
      - ./packs/genario:/etc/vmalert/packs/genario:ro
      - ./packs/genicly:/etc/vmalert/packs/genicly:ro
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        email_from_escaped=$$(printf '%s' "${ALERTMANAGER_EMAIL_FROM}" | sed -e 's/[&|]/\\&/g')
        email_to_escaped=$$(printf '%s' "${ALERTMANAGER_EMAIL_TO}" | sed -e 's/[&|]/\\&/g')
        email_smarthost_escaped=$$(printf '%s' "${ALERTMANAGER_EMAIL_SMARTHOST}" | sed -e 's/[&|]/\\&/g')
        email_auth_username_escaped=$$(printf '%s' "${ALERTMANAGER_EMAIL_AUTH_USERNAME}" | sed -e 's/[&|]/\\&/g')
        email_auth_password_escaped=$$(printf '%s' "${ALERTMANAGER_EMAIL_AUTH_PASSWORD}" | sed -e 's/[&|]/\\&/g')
        sed \
          -e "s|__ALERTMANAGER_EMAIL_FROM__|$$email_from_escaped|g" \
          -e "s|__ALERTMANAGER_EMAIL_TO__|$$email_to_escaped|g" \
          -e "s|__ALERTMANAGER_EMAIL_SMARTHOST__|$$email_smarthost_escaped|g" \
          -e "s|__ALERTMANAGER_EMAIL_AUTH_USERNAME__|$$email_auth_username_escaped|g" \
          -e "s|__ALERTMANAGER_EMAIL_AUTH_PASSWORD__|$$email_auth_password_escaped|g" \
          -e "s|__ALERTMANAGER_EMAIL_REQUIRE_TLS__|${ALERTMANAGER_EMAIL_REQUIRE_TLS}|g" \
          /etc/alertmanager/alertmanager.yml.tpl > /tmp/alertmanager.yml
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --storage.path=/alertmanager
    volumes:
      - alertmanager_data:/alertmanager
      - ./alertmanager/alertmanager.yml.tpl:/etc/alertmanager/alertmanager.yml.tpl:ro
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --web.listen-address=:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring

  glitchtip-postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GLITCHTIP_POSTGRES_DB}
      POSTGRES_USER: ${GLITCHTIP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${GLITCHTIP_POSTGRES_PASSWORD}
    volumes:
      - glitchtip_pg_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - monitoring

  glitchtip-valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - ${GLITCHTIP_VALKEY_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - valkey-cli -a "$$GLITCHTIP_VALKEY_PASSWORD" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      GLITCHTIP_VALKEY_PASSWORD: ${GLITCHTIP_VALKEY_PASSWORD}
    networks:
      - monitoring

  glitchtip:
    image: glitchtip/glitchtip:6
    restart: unless-stopped
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_healthy
    environment:
      <<: *glitchtip-environment
      SERVER_ROLE: all_in_one
    expose:
      - "8000"
    volumes:
      - glitchtip_uploads:/code/uploads
    networks:
      - monitoring
      - dokploy-network

  # Web panel for every project database: db.ilialksv.ru. Connections are
  # added in its UI and kept in dbgate_data, passwords encrypted. It reaches
  # each app server through the agent's forward-only db-tunnel, never through a
  # published database port. It shows personal data, so it stays on this VPS
  # in Russia (152-FZ).
  dbgate:
    image: dbgate/dbgate:7.3.2-alpine
    restart: unless-stopped
    # The key goes to /root/.ssh/id_rsa because that is the default path in
    # the SSH tab of DbGate's connection form; the key itself is ed25519.
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        mkdir -p /root/.ssh
        printf '%s' "$$DB_TUNNEL_PRIVATE_KEY_BASE64" | base64 -d > /root/.ssh/id_rsa
        chmod 600 /root/.ssh/id_rsa
        exec /home/dbgate-docker/entrypoint.sh
    environment:
      LOGIN: ${DBGATE_LOGIN:?DBGATE_LOGIN is required}
      PASSWORD: ${DBGATE_PASSWORD:?DBGATE_PASSWORD is required}
      DB_TUNNEL_PRIVATE_KEY_BASE64: ${DB_TUNNEL_PRIVATE_KEY_BASE64:?DB_TUNNEL_PRIVATE_KEY_BASE64 is required}
      USAGE_ANALYTICS: "false"
    expose:
      - "3000"
    volumes:
      - dbgate_data:/root/.dbgate
    networks:
      - monitoring
      - dokploy-network

  # Web analytics for every project: umami.ilialksv.ru serves the dashboard,
  # the tracker and the collect endpoint. It stores IPs, account IDs and
  # session replays, so it stays on this VPS in Russia (152-FZ).
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    init: true
    depends_on:
      umami-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${UMAMI_POSTGRES_USER}:${UMAMI_POSTGRES_PASSWORD}@umami-postgres:5432/${UMAMI_POSTGRES_DB}
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is required}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_ENCRYPTION_KEY:?UMAMI_TWO_FACTOR_ENCRYPTION_KEY is required}
      # Neutral names: ad blockers match the default script.js and /api/send.
      TRACKER_SCRIPT_NAME: p.js
      COLLECT_API_ENDPOINT: /api/p
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      # No external calls, website favicons included.
      PRIVATE_MODE: "1"
      # "1" opens the read-only MCP endpoint at /mcp for agents; it takes an
      # API key from Settings → API keys. Empty keeps it closed.
      MCP_ENABLED: "${UMAMI_MCP_ENABLED:-}"
      # Host the dashboard shows for short links. The go.ilialksv.ru domain
      # maps every path to /q/<slug>, so a link reads go.ilialksv.ru/<slug>.
      LINKS_URL: https://go.ilialksv.ru
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs http://localhost:3000/api/heartbeat
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    expose:
      - "3000"
    networks:
      - monitoring
      - dokploy-network

  umami-postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${UMAMI_POSTGRES_DB}
      POSTGRES_USER: ${UMAMI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD:?UMAMI_POSTGRES_PASSWORD is required}
    volumes:
      - umami_pg_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  grafana_data:
  victoriametrics_data:
  alertmanager_data:
  glitchtip_pg_data:
  glitchtip_uploads:
  dbgate_data:
  umami_pg_data:
