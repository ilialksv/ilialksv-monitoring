# Dokploy injects these variables from the application Environment.
# Set the Dokploy Compose command to --force-recreate, or Grafana will not
# reread dashboard JSON from the bind mount.
# Only grafana (3000), glitchtip (8000), and vmauth (8427) are public.
# Every other service stays on the monitoring network.

x-glitchtip-environment: &glitchtip-environment
  DATABASE_URL: postgres://${GLITCHTIP_POSTGRES_USER}:${GLITCHTIP_POSTGRES_PASSWORD}@glitchtip-postgres:5432/${GLITCHTIP_POSTGRES_DB}
  VALKEY_URL: redis://:${GLITCHTIP_VALKEY_PASSWORD}@glitchtip-valkey:6379/0
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
  EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
  DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL}
  ENABLE_ADMIN: "${GLITCHTIP_ENABLE_ADMIN}"
  ENABLE_OPENAPI: "${GLITCHTIP_ENABLE_OPENAPI}"
  GLITCHTIP_ENABLE_MCP: "${GLITCHTIP_ENABLE_MCP}"
  GLITCHTIP_ENABLE_DUCKDB: "${GLITCHTIP_ENABLE_DUCKDB}"

services:
  grafana:
    image: ${GRAFANA_IMAGE}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    expose:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      # Not nested under the shared dashboards mount: that parent is read-only,
      # so Docker cannot create the mountpoint and the container fails to start.
      - ./packs/genario/dashboards:/etc/grafana/dashboards-genario:ro
    networks:
      - monitoring
      - dokploy-network

  victoriametrics:
    image: ${VICTORIAMETRICS_IMAGE}
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME is required}
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=${VICTORIAMETRICS_RETENTION_MONTHS}
      - -promscrape.config=/etc/victoriametrics/scrape.yml
      - -selfScrapeInterval=30s
    volumes:
      - victoriametrics_data:/victoria-metrics-data
      - ./victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    networks:
      - monitoring

  vmauth:
    image: ${VMAUTH_IMAGE}
    restart: unless-stopped
    environment:
      VMAUTH_USERNAME: ${VMAUTH_USERNAME:?VMAUTH_USERNAME is required}
      VMAUTH_PASSWORD: ${VMAUTH_PASSWORD:?VMAUTH_PASSWORD is required}
    command:
      - -auth.config=/etc/vmauth/config.yml
      - -httpListenAddr=:8427
    expose:
      - "8427"
    volumes:
      - ./vmauth/config.yml:/etc/vmauth/config.yml:ro
    networks:
      - monitoring
      - dokploy-network

  vmalert:
    image: ${VMALERT_IMAGE}
    restart: unless-stopped
    command:
      - -rule=/etc/vmalert/rules/*.yml
      - -rule=/etc/vmalert/packs/genario/alerts.yml
      - -datasource.url=http://victoriametrics:8428
      - -notifier.url=http://alertmanager:9093
      - -httpListenAddr=:8880
      - -datasource.queryStep=30s
    volumes:
      - ./vmalert/rules:/etc/vmalert/rules:ro
      - ./packs/genario:/etc/vmalert/packs/genario:ro
    networks:
      - monitoring

  alertmanager:
    image: ${ALERTMANAGER_IMAGE}
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        email_from_escaped=$$(printf '%s' "${ALERTMANAGER_EMAIL_FROM}" | sed -e 's/[&|]/\\&/g')
        email_to_escaped=$$(printf '%s' "${ALERTMANAGER_EMAIL_TO}" | sed -e 's/[&|]/\\&/g')
        email_smarthost_escaped=$$(printf '%s' "${ALERTMANAGER_EMAIL_SMARTHOST}" | sed -e 's/[&|]/\\&/g')
        email_auth_username_escaped=$$(printf '%s' "${ALERTMANAGER_EMAIL_AUTH_USERNAME}" | sed -e 's/[&|]/\\&/g')
        email_auth_password_escaped=$$(printf '%s' "${ALERTMANAGER_EMAIL_AUTH_PASSWORD}" | sed -e 's/[&|]/\\&/g')
        sed \
          -e "s|__ALERTMANAGER_EMAIL_FROM__|$$email_from_escaped|g" \
          -e "s|__ALERTMANAGER_EMAIL_TO__|$$email_to_escaped|g" \
          -e "s|__ALERTMANAGER_EMAIL_SMARTHOST__|$$email_smarthost_escaped|g" \
          -e "s|__ALERTMANAGER_EMAIL_AUTH_USERNAME__|$$email_auth_username_escaped|g" \
          -e "s|__ALERTMANAGER_EMAIL_AUTH_PASSWORD__|$$email_auth_password_escaped|g" \
          -e "s|__ALERTMANAGER_EMAIL_REQUIRE_TLS__|${ALERTMANAGER_EMAIL_REQUIRE_TLS}|g" \
          /etc/alertmanager/alertmanager.yml.tpl > /tmp/alertmanager.yml
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --storage.path=/alertmanager
    volumes:
      - alertmanager_data:/alertmanager
      - ./alertmanager/alertmanager.yml.tpl:/etc/alertmanager/alertmanager.yml.tpl:ro
    networks:
      - monitoring

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --web.listen-address=:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring

  glitchtip-postgres:
    image: ${GLITCHTIP_POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GLITCHTIP_POSTGRES_DB}
      POSTGRES_USER: ${GLITCHTIP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${GLITCHTIP_POSTGRES_PASSWORD}
    volumes:
      - glitchtip_pg_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - monitoring

  glitchtip-valkey:
    image: ${GLITCHTIP_VALKEY_IMAGE}
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - ${GLITCHTIP_VALKEY_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - valkey-cli -a "$$GLITCHTIP_VALKEY_PASSWORD" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      GLITCHTIP_VALKEY_PASSWORD: ${GLITCHTIP_VALKEY_PASSWORD}
    networks:
      - monitoring

  glitchtip:
    image: ${GLITCHTIP_IMAGE}
    restart: unless-stopped
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_healthy
    environment:
      <<: *glitchtip-environment
      SERVER_ROLE: all_in_one
    expose:
      - "8000"
    volumes:
      - glitchtip_uploads:/code/uploads
    networks:
      - monitoring
      - dokploy-network

networks:
  monitoring:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  grafana_data:
  victoriametrics_data:
  alertmanager_data:
  glitchtip_pg_data:
  glitchtip_uploads:
