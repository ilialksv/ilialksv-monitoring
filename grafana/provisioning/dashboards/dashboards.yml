apiVersion: 1

providers:
  # One folder per project, named after its directory under
  # grafana/dashboards: genario, genicly, buiavchiann, monitoring.
  - name: projects
    orgId: 1
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
