global:
  scrape_interval: 30s

scrape_configs:
  - job_name: node
    scrape_interval: 30s
    static_configs:
      - targets:
          - node-exporter:9100

  # Containers labeled monitoring.scrape=true on dokploy-network.
  # job, project, and env come from container labels, not from this file.
  - job_name: docker
    scrape_interval: 15s
    docker_sd_configs:
      # vmagent takes the refresh period from -promscrape.dockerSDCheckInterval
      # (agent/docker-compose.yml): v1.143 refuses refresh_interval here and
      # exits on start.
      # The Docker API through docker-socket-proxy. vmagent wants http://
      # here: with tcp:// it found no container at all in 2026-10.
      - host: http://docker-socket-proxy:2375
        # A target for every network of a container, not only its first one:
        # a compose service can be on its project's default network first and
        # on dokploy-network second, and the keep rule below wants the latter.
        # buiavchiann's backend was dropped this way in 2026-10.
        match_first_network: false
    relabel_configs:
      - source_labels: [__meta_docker_container_label_monitoring_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_docker_network_name]
        regex: dokploy-network
        action: keep
      - source_labels: [__meta_docker_container_label_monitoring_port]
        regex: \d+
        action: keep
      - source_labels: [__meta_docker_container_label_monitoring_job]
        regex: .+
        action: keep
      - source_labels:
          - __meta_docker_network_ip
          - __meta_docker_container_label_monitoring_port
        separator: ":"
        regex: (.+):(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_docker_container_label_monitoring_job]
        target_label: job
      - source_labels: [__meta_docker_container_label_monitoring_project]
        target_label: project
      - source_labels: [__meta_docker_container_label_monitoring_env]
        target_label: env
      - source_labels: [__meta_docker_container_name]
        target_label: container
