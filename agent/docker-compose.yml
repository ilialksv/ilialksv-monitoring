# One instance per Dokploy deploy server, not on the monitoring VPS.
# Dokploy compose path: agent/docker-compose.yml
# The Docker socket is required for container discovery. That is root-equivalent
# access on this server: the agent reads labels and IPs, and publishes no exporter ports.

services:
  vmagent:
    image: victoriametrics/vmagent:v1.143.0
    restart: unless-stopped
    command:
      - -promscrape.config=/etc/vmagent/scrape.yml
      - -remoteWrite.url=${VMAGENT_REMOTE_WRITE_URL:?VMAGENT_REMOTE_WRITE_URL is required}
      - -remoteWrite.basicAuth.username=${VMAGENT_REMOTE_WRITE_USERNAME:?VMAGENT_REMOTE_WRITE_USERNAME is required}
      - -remoteWrite.basicAuth.password=${VMAGENT_REMOTE_WRITE_PASSWORD:?VMAGENT_REMOTE_WRITE_PASSWORD is required}
      - -remoteWrite.label=server=${SERVER_NAME:?SERVER_NAME is required}
    volumes:
      - ./scrape.yml:/etc/vmagent/scrape.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - agent
      - dokploy-network

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --web.listen-address=:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - agent

  # Forward-only SSH so DbGate on the monitoring VPS reaches the Postgres and
  # Redis services on dokploy-network. Allow this port in the provider firewall
  # from the monitoring VPS IP only: Docker-published ports bypass ufw.
  db-tunnel:
    build: ../db-tunnel
    restart: unless-stopped
    environment:
      DB_TUNNEL_PUBLIC_KEY: ${DB_TUNNEL_PUBLIC_KEY:?DB_TUNNEL_PUBLIC_KEY is required}
    ports:
      - "${DB_TUNNEL_PORT:-2222}:2222"
    volumes:
      - db_tunnel_host_keys:/etc/ssh/keys
    networks:
      - dokploy-network

networks:
  agent:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  db_tunnel_host_keys:
