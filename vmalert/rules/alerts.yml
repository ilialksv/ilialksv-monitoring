groups:
  - name: availability
    interval: 30s
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        annotations:
          summary: "{{ $labels.job }} target is down"
          description: Scrape target {{ $labels.job }} (project {{ $labels.project }}, env {{ $labels.env }}, server {{ $labels.server }}) at {{ $labels.instance }} has been unreachable for more than 2 minutes.

  - name: hosts
    interval: 30s
    rules:
      - alert: HostHighCpu
        expr: 100 - (avg by (server) (rate(node_cpu_seconds_total{mode="idle",job="node"}[5m])) * 100) > 85
        for: 15m
        annotations:
          summary: Host CPU usage is high
          description: CPU usage on {{ $labels.server }} has been above 85% for 15 minutes.

      - alert: HostLowMemory
        expr: (1 - (node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"})) > 0.9
        for: 15m
        annotations:
          summary: Host memory pressure is high
          description: Available memory on {{ $labels.server }} has been below 10% for 15 minutes.

      - alert: HostDiskAlmostFull
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay",job="node"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay",job="node"})) > 0.9
        for: 15m
        annotations:
          summary: Root filesystem is almost full
          description: Root filesystem usage on {{ $labels.server }} has been above 90% for 15 minutes.

  - name: postgres
    interval: 30s
    rules:
      - alert: PostgresTooManyConnections
        expr: sum by (instance, project, env, server) (pg_stat_activity_count{job="postgres"}) > 100
        for: 10m
        annotations:
          summary: PostgreSQL connection count is high
          description: PostgreSQL for {{ $labels.project }} {{ $labels.env }} on {{ $labels.server }} has had more than 100 active connections for 10 minutes.

  - name: redis
    interval: 30s
    rules:
      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes{job="redis"} / redis_memory_max_bytes{job="redis"} > 0.9 and redis_memory_max_bytes{job="redis"} > 0
        for: 10m
        annotations:
          summary: Redis memory usage is high
          description: Redis for {{ $labels.project }} {{ $labels.env }} on {{ $labels.server }} has been above 90% of maxmemory for 10 minutes.
